
name: Infinite RDP Session

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: "Session identifier"
        required: false
        default: ""
      openclaw_cache_version:
        description: "Bump to force OpenClaw reinstall/cache refresh, e.g. v1 -> v2"
        required: false
        default: "v1"

env:
  SESSION_MINUTES: 330
  OPENCLAW_USER_HOME: C:\Users\runneradmin
  OPENCLAW_NPM_PREFIX: C:\Users\runneradmin\.npm-global
  OPENCLAW_STATE_DIR: C:\Users\runneradmin\.openclaw
  OPENCLAW_WORKSPACE: C:\Users\runneradmin\.openclaw\workspace
  PLAYWRIGHT_BROWSERS_PATH: C:\Users\runneradmin\.playwright-browsers

jobs:
  rdp-session:
    
    timeout-minutes: 355

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate session info
        id: session
        shell: pwsh
        run: |
          $sessionId = "${{ github.event.inputs.session_id }}"
          if (:IsNullOrEmpty($sessionId)) {
            $sessionId = :NewGuid().ToString().Substring(0,8)
          }

          $openclawCacheVersion = "${{ github.event.inputs.openclaw_cache_version }}"
          if (:IsNullOrEmpty($openclawCacheVersion)) {
            $openclawCacheVersion = "v1"
          }

          $jobStartTicks = (Get-Date).Ticks

          echo "SESSION_ID=$sessionId" >> $env:GITHUB_OUTPUT
          echo "OPENCLAW_CACHE_VERSION=$openclawCacheVersion" >> $env:GITHUB_OUTPUT
          echo "JOB_START_TICKS=$jobStartTicks" >> $env:GITHUB_OUTPUT

          Write-Host "Session: $sessionId | Cache: $openclawCacheVersion"
          Write-Host "Running as: $(whoami)"
          Write-Host "USERPROFILE=$env:USERPROFILE"

      # ============================================================
      # CACHE RESTORE
      # ============================================================

      - name: Restore Tailscale installer cache
        id: cache-tailscale
        uses: actions/cache/restore@v5
        with:
          path: C:\tailscale-cache
          key: tailscale-v1-${{ runner.os }}

      - name: Restore npm global packages cache
        id: cache-npm-global
        uses: actions/cache/restore@v5
        with:
          path: C:\Users\runneradmin\.npm-global
          key: npm-global-openclaw-${{ steps.session.outputs.OPENCLAW_CACHE_VERSION }}-${{ runner.os }}

      - name: Restore Playwright browsers cache
        id: cache-playwright
        uses: actions/cache/restore@v5
        with:
          path: C:\Users\runneradmin\.playwright-browsers
          key: playwright-browsers-v1-${{ runner.os }}

      # ============================================================
      # TAILSCALE SETUP
      # ============================================================

      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $cacheDir = "C:\tailscale-cache"
          $cachedMsi = "$cacheDir\tailscale-setup.msi"

          if (Test-Path $cachedMsi) {
            Write-Host "Tailscale: installing from cache"
            $installer = $cachedMsi
          } else {
            Write-Host "Tailscale: downloading"
            New-Item -ItemType Directory -Path $cacheDir -Force | Out-Null
            $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
            $installer = $cachedMsi
            Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing
          }

          Start-Process msiexec.exe -ArgumentList "/i", $installer, "/quiet", "/norestart" -Wait

          $env:PATH += ";C:\Program Files\Tailscale"
          echo "C:\Program Files\Tailscale" >> $env:GITHUB_PATH

      - name: Connect to Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if (:IsNullOrEmpty($env:TAILSCALE_AUTHKEY)) {
            Write-Host "ERROR: TAILSCALE_AUTHKEY secret is missing."
            exit 1
          }

          $sessionId = "${{ steps.session.outputs.SESSION_ID }}"
          $hostname = "gh-rdp-$sessionId"

          Start-Service -Name "Tailscale" -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5

          & "C:\Program Files\Tailscale\tailscale.exe" up `
            --authkey="$env:TAILSCALE_AUTHKEY" `
            --hostname="$hostname" `
            --accept-routes `
            --accept-dns

          Start-Sleep -Seconds 10

          $status = & "C:\Program Files\Tailscale\tailscale.exe" ip -4

          Write-Host "=========================================="
          Write-Host "TAILSCALE IP: $status"
          Write-Host "HOSTNAME: $hostname"
          Write-Host "=========================================="

      # ============================================================
      # RDP SETUP
      # ============================================================

      - name: Configure RDP Access
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=tcp localport=3389
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "fDisableClip" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "fDisableCdm" -Value 0

          Write-Host "RDP configured"

      - name: Create RDP User
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Continue"

          $username = "rdpuser"
          $password = $env:RDP_PASSWORD

          if (:IsNullOrEmpty($password)) {
            Write-Host "ERROR: RDP_PASSWORD secret is missing."
            exit 1
          }

          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force

          try {
            New-LocalUser -Name $username -Password $securePassword -FullName "RDP User" -Description "GitHub Actions RDP User" -PasswordNeverExpires
          } catch {
            Set-LocalUser -Name $username -Password $securePassword
          }

          Add-LocalGroupMember -Group "Administrators" -Member $username -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username -ErrorAction SilentlyContinue

          Write-Host "RDP user '$username' ready"

      - name: Initialize rdpuser profile
        id: rdpuser
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Continue"

          $username = "rdpuser"
          $password = $env:RDP_PASSWORD
          $rdpUserHome = "C:\Users\rdpuser"

          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force
          $credential = New-Object System.Management.Automation.PSCredential($username, $securePassword)

          Start-Process -FilePath "cmd.exe" -ArgumentList "/c", "echo Profile initialized" -Credential $credential -Wait -NoNewWindow -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5

          $userSID = (Get-CimInstance -ClassName Win32_UserAccount -Filter "Name='$username' AND LocalAccount=True").SID
          if ($userSID) {
            $profileRegPath = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList\$userSID"
            if (Test-Path $profileRegPath) {
              $currentProfilePath = (Get-ItemProperty -Path $profileRegPath).ProfileImagePath
              if ($currentProfilePath -ne $rdpUserHome) {
                Write-Host "Fixing ProfileImagePath: '$currentProfilePath' -> '$rdpUserHome'"
                Set-ItemProperty -Path $profileRegPath -Name "ProfileImagePath" -Value $rdpUserHome
              }
            } else {
              Write-Host "Creating profile registry entry for SID: $userSID"
              New-Item -Path $profileRegPath -Force | Out-Null
              Set-ItemProperty -Path $profileRegPath -Name "ProfileImagePath" -Value $rdpUserHome
              Set-ItemProperty -Path $profileRegPath -Name "Flags" -Value 0 -Type DWord
              Set-ItemProperty -Path $profileRegPath -Name "State" -Value 0 -Type DWord
            }
          }

          $dirs = @(
            "$rdpUserHome\Desktop",
            "$rdpUserHome\projects",
            "$rdpUserHome\AppData\Roaming",
            "$rdpUserHome\AppData\Local"
          )

          $dirs | ForEach-Object {
            New-Item -ItemType Directory -Path $_ -Force | Out-Null
          }

          cmd /c "icacls `"$rdpUserHome`" /grant rdpuser:(OI)(CI)F /T /Q"
          $global:LASTEXITCODE = 0

          echo "RDPUSER_HOME=$rdpUserHome" >> $env:GITHUB_OUTPUT

          Write-Host "rdpuser profile initialized: $rdpUserHome"

      # ============================================================
      # BASIC DEVELOPMENT TOOLS
      # ============================================================

      - name: Install Development Tools
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"

          $chocoCmd = Get-Command choco -ErrorAction SilentlyContinue
          if (-not $chocoCmd) {
            Write-Host "Chocolatey not found, installing..."
            Set-ExecutionPolicy Bypass -Scope Process -Force
            [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
            iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
            $env:PATH = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          } else {
            Write-Host "Chocolatey already available at: $($chocoCmd.Source)"
          }

          function Install-Tool {
            param($Name, $ChocoPkg, $TestPath)

            if ($TestPath -and (Test-Path $TestPath)) {
              Write-Host "SKIP: $Name already installed"
              return
            }

            Write-Host "INSTALL: $Name"
            choco install -y $ChocoPkg --no-progress
            if ($LASTEXITCODE -eq 0) {
              Write-Host "OK: $Name installed"
            } else {
              Write-Host "WARNING: Failed to install $Name"
            }
          }

          Install-Tool -Name "VS Code" -ChocoPkg "vscode.install" -TestPath "C:\Program Files\Microsoft VS Code\Code.exe"
          Install-Tool -Name "Notepad++" -ChocoPkg "notepadplusplus" -TestPath "C:\Program Files\Notepad++\notepad++.exe"
          Install-Tool -Name "Firefox" -ChocoPkg "firefox" -TestPath "C:\Program Files\Mozilla Firefox\firefox.exe"

          if (-not (Test-Path "C:\Program Files\Google\Chrome\Application\chrome.exe")) {
            Write-Host "INSTALL: Chrome"
            choco install -y googlechrome --ignore-checksums --no-progress
          } else {
            Write-Host "SKIP: Chrome already installed"
          }

          $braveCandidates = @(
            "C:\Program Files\BraveSoftware\Brave-Browser\Application\brave.exe",
            "C:\Program Files (x86)\BraveSoftware\Brave-Browser\Application\brave.exe"
          )

          $braveFound = $braveCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $braveFound) {
            Write-Host "INSTALL: Brave"
            choco install -y brave --no-progress
          } else {
            Write-Host "SKIP: Brave already installed at $braveFound"
          }

      # ============================================================
      # OPENCLAW INSTALL + CONFIGURE
      # ============================================================

      - name: Install OpenClaw
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Running as:"
          whoami

          $userHome = $env:USERPROFILE
          Write-Host "Using USERPROFILE=$userHome"

          $npmPrefix = "$userHome\.npm-global"
          New-Item -ItemType Directory -Path $npmPrefix -Force | Out-Null

          $env:NPM_CONFIG_PREFIX = $npmPrefix
          $env:PATH = "$npmPrefix;$env:PATH"

          Write-Host "NPM_CONFIG_PREFIX=$env:NPM_CONFIG_PREFIX"

          $openclawCli = "$npmPrefix\node_modules\openclaw\openclaw.mjs"
          $cacheWorking = $false

          if ("${{ steps.cache-npm-global.outputs.cache-hit }}" -eq "true") {
            Write-Host "npm-global cache hit. Validating OpenClaw..."

            if (Test-Path $openclawCli) {
              try {
                $ver = node $openclawCli --version 2>&1
                if ($LASTEXITCODE -eq 0) {
                  Write-Host "OpenClaw restored from cache: $ver"
                  $cacheWorking = $true
                } else {
                  Write-Host "WARNING: Cached OpenClaw failed validation. Exit code: $LASTEXITCODE"
                }
              } catch {
                Write-Host "WARNING: Cached OpenClaw validation threw: $_"
              }
            } else {
              Write-Host "WARNING: Cache hit but OpenClaw CLI not found at: $openclawCli"
            }
          } else {
            Write-Host "No npm-global cache hit."
          }

          if (-not $cacheWorking) {
            Write-Host "Installing openclaw@latest fresh..."
            npm install -g openclaw@latest
          }

          Write-Host "Resolved openclaw command:"
          Get-Command openclaw | Format-List *

          Write-Host "OpenClaw version:"
          openclaw --version

          Write-Host "OpenClaw install complete."

      - name: Configure OpenClaw
        shell: pwsh
        env:
          OPENCLAW_CONFIG: ${{ secrets.OPENCLAW_CONFIG }}
          OPENCLAW_AUTH_PROFILES: ${{ secrets.OPENCLAW_AUTH_PROFILES }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Running as:"
          whoami

          $userHome = $env:USERPROFILE
          Write-Host "Using USERPROFILE=$userHome"

          $npmPrefix = "$userHome\.npm-global"
          $env:NPM_CONFIG_PREFIX = $npmPrefix
          $env:PATH = "$npmPrefix;$env:PATH"

          $openclawDir = "$userHome\.openclaw"
          $agentDir = "$openclawDir\agents\main\agent"
          $workspaceDir = "$openclawDir\workspace"

          New-Item -ItemType Directory -Path $openclawDir -Force | Out-Null
          New-Item -ItemType Directory -Path $agentDir -Force | Out-Null
          New-Item -ItemType Directory -Path $workspaceDir -Force | Out-Null

          if (-not $env:OPENCLAW_CONFIG) {
            Write-Host "ERROR: No OPENCLAW_CONFIG secret found."
            exit 1
          }

          Write-Host "Preparing openclaw.json from secret..."

          $config = $env:OPENCLAW_CONFIG

          $escapedUserHomeForJsonBackslash = $userHome -replace '\\', '\\'
          $escapedUserHomeForSlash = $userHome -replace '\\', '/'

          $config = $config -replace 'C:\\Users\\[^\\"]+', $escapedUserHomeForJsonBackslash
          $config = $config -replace 'C:/Users/[^/"]+', $escapedUserHomeForSlash

          try {
            $configObj = $config | ConvertFrom-Json
            $sanitizedKeys = @("remoteId", "remote_id")
            $didSanitize = $false

            if ($configObj.models -and $configObj.models.providers) {
              foreach ($providerProp in $configObj.models.providers.PSObject.Properties) {
                $provider = $providerProp.Value

                if ($provider.models -and $provider.models -is [System.Array]) {
                  for ($i = 0; $i -lt $provider.models.Count; $i++) {
                    $model = $provider.models[$i]

                    foreach ($badKey in $sanitizedKeys) {
                      if ($model.PSObject.Properties[$badKey]) {
                        Write-Host "SANITIZE: Removing '$badKey' from $($providerProp.Name).models[$i]"
                        $model.PSObject.Properties.Remove($badKey)
                        $didSanitize = $true
                      }
                    }
                  }
                }
              }
            }

            if ($didSanitize) {
              $config = $configObj | ConvertTo-Json -Depth 50
              Write-Host "Config sanitized."
            }
          } catch {
            Write-Host "WARNING: Config sanitization failed. Writing config as-is."
            Write-Host $_
          }

          $openclawConfigPath = "$openclawDir\openclaw.json"
          Set-Content -Path $openclawConfigPath -Value $config -Encoding UTF8

          Write-Host "Injected openclaw.json:"
          Write-Host "  $openclawConfigPath"

          if ($env:OPENCLAW_AUTH_PROFILES) {
            $authProfilesPath = "$agentDir\auth-profiles.json"
            Set-Content -Path $authProfilesPath -Value $env:OPENCLAW_AUTH_PROFILES -Encoding UTF8

            Write-Host "Injected auth-profiles.json:"
            Write-Host "  $authProfilesPath"
          } else {
            Write-Host "WARNING: No OPENCLAW_AUTH_PROFILES secret found."
          }

          Write-Host "Verifying OpenClaw config..."
          openclaw --version
          openclaw config get gateway
          openclaw config get browser

          Write-Host "OpenClaw configured."

      - name: Patch OpenClaw
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"

          $userHome = $env:USERPROFILE
          $env:NPM_CONFIG_PREFIX = "$userHome\.npm-global"
          $env:PATH = "$userHome\.npm-global;$env:PATH"
          $env:PLAYWRIGHT_BROWSERS_PATH = "$userHome\.playwright-browsers"

          $patchScript = Join-Path $env:GITHUB_WORKSPACE "patch-windows.ps1"
          if (Test-Path $patchScript) {
            Write-Host "Running OpenClaw patch script..."
            & $patchScript
          } else {
            Write-Host "WARNING: patch-windows.ps1 not found in repo root -- skipping patching"
          }

      # ============================================================
      # PLAYWRIGHT + BROWSER
      # ============================================================

      - name: Install Playwright and Chromium for browser control
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Running as:"
          whoami

          $userHome = $env:USERPROFILE
          Write-Host "Using USERPROFILE=$userHome"

          $npmPrefix = "$userHome\.npm-global"
          $browsersPath = "$userHome\.playwright-browsers"

          New-Item -ItemType Directory -Path $npmPrefix -Force | Out-Null
          New-Item -ItemType Directory -Path $browsersPath -Force | Out-Null

          $env:NPM_CONFIG_PREFIX = $npmPrefix
          $env:PATH = "$npmPrefix;$env:PATH"
          $env:PLAYWRIGHT_BROWSERS_PATH = $browsersPath

          $pwCli = "$npmPrefix\node_modules\playwright\cli.js"

          if (-not (Test-Path $pwCli)) {
            Write-Host "Installing Playwright npm package globally..."
            npm install -g playwright
          } else {
            Write-Host "Playwright npm package already present."
          }

          Write-Host "Playwright version:"
          npx playwright --version

          Write-Host "Installing/validating Playwright Chromium..."
          npx playwright install chromium

          Write-Host "Installed Playwright browsers:"
          npx playwright install --list

          Write-Host "Playwright + Chromium ready at: $browsersPath"

      - name: Restore workspace from artifact
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: openclaw-workspace
          path: C:\Users\runneradmin\.openclaw\workspace
          github-token: ${{ secrets.GH_PAT }}
          run-id: ${{ github.run_id }}

      - name: Start OpenClaw managed browser
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "Running as:"
          whoami

          $userHome = $env:USERPROFILE
          Write-Host "Using USERPROFILE=$userHome"

          $env:NPM_CONFIG_PREFIX = "$userHome\.npm-global"
          $env:PATH = "$userHome\.npm-global;$env:PATH"
          $env:PLAYWRIGHT_BROWSERS_PATH = "$userHome\.playwright-browsers"

          Write-Host "OpenClaw binary:"
          Get-Command openclaw | Format-List *

          Write-Host "OpenClaw version:"
          openclaw --version

          Write-Host "OpenClaw status:"
          openclaw status --all

          Write-Host "Gateway status before restart:"
          openclaw gateway status

          Write-Host "Checking port 18789..."
          Get-NetTCPConnection -LocalPort 18789 -ErrorAction SilentlyContinue | Format-Table -AutoSize

          Write-Host "Running OpenClaw doctor..."
          openclaw doctor

          Write-Host "Restarting gateway..."
          openclaw gateway restart
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Gateway restart failed. Trying install --force then restart..."
            openclaw gateway install --force
            openclaw gateway restart
          }

          Write-Host "Waiting for OpenClaw gateway to be healthy..."
          $maxWait = 60
          $waited = 0
          $gatewayReady = $false

          while ($waited -lt $maxWait) {
            try {
              $resp = Invoke-WebRequest `
                -Uri "http://127.0.0.1:18789/" `
                -UseBasicParsing `
                -TimeoutSec 3 `
                -ErrorAction Stop

              if ($resp.StatusCode -eq 200 -or $resp.StatusCode -eq 401) {
                Write-Host "Gateway HTTP endpoint responded with $($resp.StatusCode)"

                openclaw gateway status
                if ($LASTEXITCODE -eq 0) {
                  $gatewayReady = $true
                  break
                }
              }
            } catch {
              Write-Host "Gateway not ready yet: $($_.Exception.Message)"
            }

            Start-Sleep -Seconds 3
            $waited += 3
          }

          if (-not $gatewayReady) {
            Write-Host "WARNING: Gateway did not become healthy."
            Write-Host "Recent OpenClaw logs:"
            openclaw logs --tail 200
            exit 0
          }

          Write-Host "Configuring managed browser profile..."
          openclaw config set browser.defaultProfile "openclaw"

          Write-Host "Configuring local browser mode..."
          openclaw config set gateway.nodes.browser.mode "off"

          Write-Host "Starting OpenClaw managed browser..."
          openclaw browser --browser-profile openclaw start
          $browserStartExit = $LASTEXITCODE

          Start-Sleep -Seconds 5

          Write-Host "Browser status:"
          openclaw browser --browser-profile openclaw status
          $browserStatusExit = $LASTEXITCODE

          Write-Host "Checking CDP endpoint..."
          try {
            Invoke-WebRequest `
              -Uri "http://127.0.0.1:18800/json/version" `
              -UseBasicParsing `
              -TimeoutSec 5 `
              -ErrorAction Stop | Out-Null

            Write-Host "Browser CDP endpoint is reachable on port 18800"
          } catch {
            Write-Host "WARNING: Browser CDP endpoint not reachable."
            Write-Host "Browser start exit code: $browserStartExit"
            Write-Host "Browser status exit code: $browserStatusExit"
            Write-Host "Recent OpenClaw logs:"
            openclaw logs --tail 200
            exit 0
          }

          Write-Host "OpenClaw browser startup step completed."
          exit 0

      - name: Prepare optional Brave OpenClaw shortcut
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"

          $rdpUserHome = "${{ steps.rdpuser.outputs.RDPUSER_HOME }}"
          if (-not $rdpUserHome -or -not (Test-Path $rdpUserHome)) {
            Write-Host "WARNING: RDP user home not found: $rdpUserHome"
            exit 0
          }

          Write-Host "RDP user home: $rdpUserHome"
          Write-Host "Current workflow user: $(whoami)"
          Write-Host "Current USERPROFILE: $env:USERPROFILE"

          $userHome = $env:USERPROFILE
          $env:NPM_CONFIG_PREFIX = "$userHome\.npm-global"
          $env:PATH = "$userHome\.npm-global;$env:PATH"

          Write-Host "Installing OpenClaw browser extension files..."
          $installOutput = openclaw browser extension install 2>&1 | Out-String
          Write-Host $installOutput

          $candidatePaths = @(
            "$env:USERPROFILE\.openclaw\browser\chrome-extension",
            "C:\Users\runneradmin\.openclaw\browser\chrome-extension",
            "$rdpUserHome\.openclaw\browser\chrome-extension"
          )

          $sourceExtPath = $candidatePaths | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $sourceExtPath) {
            Write-Host "WARNING: OpenClaw extension directory was not found."
            Write-Host "Checked:"
            $candidatePaths | ForEach-Object { Write-Host "  - $_" }
            exit 0
          }

          $targetExtPath = "$rdpUserHome\.openclaw\browser\chrome-extension"

          if ($sourceExtPath -ne $targetExtPath) {
            Write-Host "Copying extension to RDP user profile..."
            New-Item -ItemType Directory -Path (Split-Path $targetExtPath) -Force | Out-Null

            if (Test-Path $targetExtPath) {
              Remove-Item $targetExtPath -Recurse -Force -ErrorAction SilentlyContinue
            }

            Copy-Item -Path $sourceExtPath -Destination $targetExtPath -Recurse -Force
          }

          if (-not (Test-Path $targetExtPath)) {
            Write-Host "WARNING: Target extension path missing after copy: $targetExtPath"
            exit 0
          }

          cmd /c "icacls `"$targetExtPath`" /grant rdpuser:(OI)(CI)R /T /Q"
          $global:LASTEXITCODE = 0

          $braveCandidates = @(
            "C:\Program Files\BraveSoftware\Brave-Browser\Application\brave.exe",
            "C:\Program Files (x86)\BraveSoftware\Brave-Browser\Application\brave.exe",
            "$rdpUserHome\AppData\Local\BraveSoftware\Brave-Browser\Application\brave.exe",
            "$env:LOCALAPPDATA\BraveSoftware\Brave-Browser\Application\brave.exe"
          )

          $bravePath = $braveCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $bravePath) {
            Write-Host "WARNING: Brave not found."
            exit 0
          }

          $braveUserDataDir = "$rdpUserHome\AppData\Local\BraveSoftware\Brave-Browser\User Data"
          $braveProfileName = "OpenClaw"

          New-Item -ItemType Directory -Path $braveUserDataDir -Force | Out-Null

          $desktopDir = "$rdpUserHome\Desktop"
          New-Item -ItemType Directory -Path $desktopDir -Force | Out-Null

          $launchScriptPath = "$desktopDir\Brave-OpenClaw.bat"

          $launchLines = @(
            '@echo off',
            'REM Launch Brave with OpenClaw extension pre-loaded for manual debugging',
            "start `"`" `"$bravePath`" --user-data-dir=`"$braveUserDataDir`" --profile-directory=`"$braveProfileName`" --load-extension=`"$targetExtPath`" --no-first-run --no-default-browser-check"
          )

          [System.IO.File]::WriteAllText(
            $launchScriptPath,
            ($launchLines -join "`r`n"),
            [System.Text.Encoding]::ASCII
          )

          cmd /c "icacls `"$desktopDir`" /grant rdpuser:(OI)(CI)F /T /Q"
          $global:LASTEXITCODE = 0

          Write-Host "Optional Brave OpenClaw shortcut created:"
          Write-Host "  $launchScriptPath"
          Write-Host "Extension path:"
          Write-Host "  $targetExtPath"
          Write-Host "Brave path:"
          Write-Host "  $bravePath"

          exit 0

      # ============================================================
      # CONNECTION INFO
      # ============================================================

      - name: Display Connection Info
        shell: pwsh
        run: |
          $tailscaleIp = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          $sessionId = "${{ steps.session.outputs.SESSION_ID }}"
          $rdpUserHome = "${{ steps.rdpuser.outputs.RDPUSER_HOME }}"
          $userHome = $env:USERPROFILE

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "       RDP SESSION READY"
          Write-Host "=============================================="
          Write-Host ""
          Write-Host "Session ID:    $sessionId"
          Write-Host "Tailscale IP:  $tailscaleIp"
          Write-Host "Hostname:      gh-rdp-$sessionId"
          Write-Host ""
          Write-Host "Connect via RDP:"
          Write-Host "  Address:  $tailscaleIp:3389"
          Write-Host "  -or-      gh-rdp-$sessionId:3389"
          Write-Host "  Username: rdpuser"
          Write-Host "  Password: from RDP_PASSWORD secret"
          Write-Host ""
          Write-Host "RDP user profile:"
          Write-Host "  $rdpUserHome"
          Write-Host ""
          Write-Host "OpenClaw runtime user:"
          Write-Host "  $(whoami)"
          Write-Host ""
          Write-Host "OpenClaw:"
          Write-Host "  Config:     $userHome\.openclaw\openclaw.json"
          Write-Host "  Workspace:  $userHome\.openclaw\workspace"
          Write-Host "  NPM prefix: $userHome\.npm-global"
          Write-Host "  PW browser: $userHome\.playwright-browsers"
          Write-Host ""
          Write-Host "Managed browser:"
          Write-Host "  Profile:   openclaw"
          Write-Host "  CDP Port:  18800"
          Write-Host ""
          Write-Host "Optional Brave manual launcher:"
          Write-Host "  $rdpUserHome\Desktop\Brave-OpenClaw.bat"
          Write-Host ""
          Write-Host "Session duration target: ${{ env.SESSION_MINUTES }} minutes"
          Write-Host "=============================================="


      - name: Keep session alive (phase 1 - until chain trigger)
        id: keepalive
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          # Calculate times from JOB START, not from now.
          $jobStart = :new([long]"${{ steps.session.outputs.JOB_START_TICKS }}")
          $chainTime = $jobStart.AddMinutes(${{ env.CHAIN_TRIGGER_MINUTES }})
          $hardLimitTime = $jobStart.AddMinutes(350)
          $saveInterval = ${{ env.SAVE_INTERVAL_MINUTES }}
      
          # ===== REPRESENTATION ONLY =====
          $runtimeHome = "C:\Users\runneradmin"   # OpenClaw / Node / Playwright
          $rdpUserHome = "C:\Users\rdpuser"       # RDP / scheduled tasks
          # ===============================
      
          $repo = "${{ github.repository }}"
          $sessionId = "${{ steps.session.outputs.SESSION_ID }}"
          $chainCount = [int]"${{ steps.session.outputs.CHAIN_COUNT }}"
          $openclawCacheVersion = "${{ steps.session.outputs.OPENCLAW_CACHE_VERSION }}"
      
          $lastSaveTime = Get-Date
          $chainTriggered = $false
          $loopCount = 0
          $gcInterval = 30
      
          function Save-Secrets {
            $configFile = "$runtimeHome\.openclaw\openclaw.json"
            $authFile = "$runtimeHome\.openclaw\agents\main\agent\auth-profiles.json"
            try {
              if (Test-Path $configFile) {
                Get-Content $configFile -Raw | gh secret set OPENCLAW_CONFIG --repo $repo 2>&1 | Out-Null
              }
              if (Test-Path $authFile) {
                Get-Content $authFile -Raw | gh secret set OPENCLAW_AUTH_PROFILES --repo $repo 2>&1 | Out-Null
              }
            } catch {}
          }
      
          function Trigger-Chain {
            $nextChainCount = $chainCount + 1
            $body = @{
              event_type = 'chain-rdp'
              client_payload = @{
                session_id = $sessionId
                chain_count = $nextChainCount
                openclaw_cache_version = $openclawCacheVersion
              }
            } | ConvertTo-Json -Compress
      
            $maxRetries = 3
            for ($i = 1; $i -le $maxRetries; $i++) {
              try {
                $body | gh api "repos/$repo/dispatches" --method POST --input -
                if ($LASTEXITCODE -eq 0) { return $true }
              } catch {}
              Start-Sleep -Seconds ($i * 10)
            }
            return $false
          }
      
          while ((Get-Date) -lt $hardLimitTime) {
            $loopCount++
      
            $restartFlag = "$runtimeHome\.openclaw\.restart"
            if (Test-Path $restartFlag) {
              Remove-Item $restartFlag -Force -ErrorAction SilentlyContinue
              taskkill /F /IM node.exe 2>$null
              $script:openclawFailCount = 0
            }
      
            $nodeProcs = Get-Process -Name "node" -ErrorAction SilentlyContinue
            if (-not $nodeProcs) {
              schtasks /Run /TN "OpenClawGateway" 2>$null
            }
            $nodeProcs = $null
      
            try {
              Invoke-WebRequest -Uri "http://127.0.0.1:18800/json/version" -TimeoutSec 3 -UseBasicParsing | Out-Null
              $script:browserFailCount = 0
            } catch {
              if (-not (Test-Path variable:script:browserFailCount)) { $script:browserFailCount = 0 }
              $script:browserFailCount++
            }
      
            if (((Get-Date) - $lastSaveTime).TotalMinutes -ge $saveInterval) {
              Save-Secrets
              $lastSaveTime = Get-Date
            }
      
            if (-not $chainTriggered -and (Get-Date) -ge $chainTime) {
              Save-Secrets
              $chainTriggered = Trigger-Chain
              if ($chainTriggered) {
                echo "CHAIN_DONE=true" >> $env:GITHUB_OUTPUT
              }
            }
      
            if ($loopCount % $gcInterval -eq 0) {
              [System.GC]::Collect()
              [System.GC]::WaitForPendingFinalizers()
            }
      
            Start-Sleep -Seconds 60
          }
      
          Save-Secrets
          if (-not $chainTriggered) {
            echo "CHAIN_DONE=false" >> $env:GITHUB_OUTPUT
          }
      
      - name: Save secrets (fallback)
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          $runtimeHome = "C:\Users\runneradmin"
          $repo = "${{ github.repository }}"
          $configFile = "$runtimeHome\.openclaw\openclaw.json"
          $authFile = "$runtimeHome\.openclaw\agents\main\agent\auth-profiles.json"
          try {
            if (Test-Path $configFile) {
              Get-Content $configFile -Raw | gh secret set OPENCLAW_CONFIG --repo $repo
            }
            if (Test-Path $authFile) {
              Get-Content $authFile -Raw | gh secret set OPENCLAW_AUTH_PROFILES --repo $repo
            }
          } catch {}
        continue-on-error: true
      
      - name: Clean workspace before upload
        if: always()
        shell: pwsh
        run: |
          $workspace = "C:\Users\runneradmin\.openclaw\workspace"
          if (-not (Test-Path $workspace)) { exit 0 }
          $transientNames = @("downloads","temp","tmp","cache",".cache","node_modules","__pycache__",".venv","venv")
          foreach ($name in $transientNames) {
            Get-ChildItem -Path $workspace -Directory -Recurse -Filter $name -ErrorAction SilentlyContinue |
              ForEach-Object { Remove-Item $_.FullName -Recurse -Force -ErrorAction SilentlyContinue }
          }
      
      - name: Upload workspace artifact (for next session)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: openclaw-workspace
          path: C:\Users\runneradmin\.openclaw\workspace
          retention-days: 90
          if-no-files-found: ignore
          overwrite: true
      
      - name: Trigger next session (fallback)
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          $chainDone = "${{ steps.keepalive.outputs.CHAIN_DONE }}"
          if ($chainDone -eq "true") {
            Write-Host "Chain already triggered by keepalive loop - skipping fallback"
            exit 0
          }
      
          $sessionId = "${{ steps.session.outputs.SESSION_ID }}"
          $nextChainCount = [int]"${{ steps.session.outputs.CHAIN_COUNT }}" + 1
          $openclawCacheVersion = "${{ steps.session.outputs.OPENCLAW_CACHE_VERSION }}"
          $repo = "${{ github.repository }}"
      
          $body = @{
            event_type = 'chain-rdp'
            client_payload = @{
              session_id = $sessionId
              chain_count = $nextChainCount
              openclaw_cache_version = $openclawCacheVersion
            }
          } | ConvertTo-Json -Compress
      
          for ($i = 1; $i -le 3; $i++) {
            try {
              $body | gh api "repos/$repo/dispatches" --method POST --input -
              if ($LASTEXITCODE -eq 0) { break }
            } catch {}
            Start-Sleep -Seconds ($i * 15)
          }
      
      - name: Save npm global packages cache
        if: ${{ always() && steps.cache-npm-global.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: C:\Users\runneradmin\.npm-global
          key: npm-global-openclaw-${{ steps.session.outputs.OPENCLAW_CACHE_VERSION }}-${{ runner.os }}
      
      - name: Save Playwright browsers cache
        if: ${{ always() && steps.cache-playwright.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: C:\Users\runneradmin\.playwright-browsers
          key: playwright-browsers-v1-${{ runner.os }}
